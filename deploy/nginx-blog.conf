# Nginx + certbot 备选方案（服务器已跑 nginx 时用这个，否则建议直接用 Caddyfile）
#
# 用法：
#   1. 把 your-domain.com 换成真实域名，放到 /etc/nginx/sites-available/blog
#      并软链到 sites-enabled/
#   2. 先把两个 ssl_certificate 行注释掉、放开下方 80 端口的纯 HTTP server，
#      执行：certbot --nginx -d your-domain.com   （certbot 会自动配好证书并改写本文件）
#   3. nginx -t && systemctl reload nginx
#
# 同样依赖 X-Forwarded-For 传递真实 IP；后端默认已按 NATIVE 解析，无需额外设置。

# certbot 签发前临时用；签发成功后 certbot 会自动接管 80 并保留跳转
server {
	listen 80;
	server_name your-domain.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	server_name your-domain.com;

	# 后台可上传 64MB 背景视频；nginx 默认请求体上限仅 1MB，不放开会在反代层直接 413
	client_max_body_size 65m;

	# certbot --nginx 会自动改写为实际证书路径；也可自行指定：
	# ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	# 强制浏览器此后只走 HTTPS（含子域），两年有效期滚动续期
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	# SPA 的 CSP：脚本只许本站；样式放行内联（Element Plus 动态样式），
	# 图片/媒体放行 https 外链（外链配图、背景素材），连接只许同源 API
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; media-src 'self' https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

	root /var/www/blog-qd;
	index index.html;

	# SPA：vue-router history 模式，未命中文件回落 index.html
	location / {
		try_files $uri $uri/ /index.html;
	}

	# API 反代：blog-hd 只监听本机 8080；X-Forwarded-For 供后端还原真实客户端 IP
	location /api/ {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# 管理后台（blog-ht/dist）：alias 剥掉 /admin/ 前缀，SPA 未命中回落后台首页
	location /admin/ {
		alias /var/www/blog-ht/;
		try_files $uri $uri/ /admin/index.html;
	}
	location = /admin {
		return 301 /admin/;
	}
}
